services:
  backend:
    build: ./backend
    volumes:
      - ./data:/data
    environment:
      # Copernicus Data Space S3 keys, read from .env (not committed).
      CDSE_S3_ACCESS_KEY: ${CDSE_S3_ACCESS_KEY:-}
      CDSE_S3_SECRET_KEY: ${CDSE_S3_SECRET_KEY:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Host port for the site; set SOPPKART_PORT in .env if 80 is taken.
      - "${SOPPKART_PORT:-80}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
