# Works with plain `docker compose up -d --build` and as a Komodo stack.
# The site is reached through an existing Caddy on the external `public-caddy`
# network: point it at http://soppkart:80. No host ports are published.
#
# Settings come from .env (or the stack's Environment in Komodo):
#   SOPPKART_DATA       host folder with features, models, findings and your own
#                       finds (default ./data next to this file)
#   CDSE_S3_ACCESS_KEY  Copernicus Data Space keys, only needed to rebuild the
#   CDSE_S3_SECRET_KEY  data from scratch (soppkart all)
#   ESRI_API_KEY        ArcGIS Location Platform key for the aerial photo background
#                       (optional; used by the backend only, never sent to browsers)
#   ESRI_REFERER        your site's address, if the key is restricted by referrer
#   STRAVA_SESSION      your _strava4_session cookie from strava.com, for the Strava
#                       heatmap layer (optional; heatmap access is renewed automatically)
#   SOPPKART_COOKIE_SECURE  true when the site is served over HTTPS, so the login
#                       cookie is never sent over plain HTTP
services:
  backend:
    build: ./backend
    volumes:
      - ${SOPPKART_DATA:-./data}:/data
      # Raw downloads (~21 GB), only used to rebuild the features.
      - raw:/data/raw
    environment:
      CDSE_S3_ACCESS_KEY: ${CDSE_S3_ACCESS_KEY:-}
      CDSE_S3_SECRET_KEY: ${CDSE_S3_SECRET_KEY:-}
      ESRI_API_KEY: ${ESRI_API_KEY:-}
      ESRI_REFERER: ${ESRI_REFERER:-}
      STRAVA_SESSION: ${STRAVA_SESSION:-}
      SOPPKART_COOKIE_SECURE: ${SOPPKART_COOKIE_SECURE:-}
      REDIS_URL: redis://soppkart-redis:6379/0
    depends_on:
      - redis
    networks:
      default:
        # Unique name: the frontend is also on public-caddy, where other stacks
        # may have a service called "backend".
        aliases:
          - soppkart-backend
    restart: unless-stopped

  # In-memory cache for aerial photo tiles: 1 GB, least recently used tiles are
  # dropped first, nothing is written to disk. Only on the internal network.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    networks:
      default:
        aliases:
          - soppkart-redis
    restart: unless-stopped

  # Serves the app and proxies /api to the backend over the internal network.
  frontend:
    build: ./frontend
    container_name: soppkart
    networks:
      - default
      - public-caddy
    depends_on:
      - backend
    restart: unless-stopped

networks:
  public-caddy:
    external: true

volumes:
  raw:
