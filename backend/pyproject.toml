[project]
name = "soppkart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thomas Nielsen", email = "thomas.nielsen98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.101",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.1",
    "redis>=8.1.0",
    "rio-tiler>=9.4.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.53.0",
    "xgboost>=3.4.1",
]

[project.scripts]
soppkart = "soppkart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
